<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Meridian Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  body{ background: var(--bg-deep); color: var(--ink-on-deep); overflow: hidden; }
  .nf-wrap{
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px var(--gutter); position: relative;
  }
  .nf-brand{ position: absolute; top: 32px; left: var(--gutter); display:flex; align-items:center; gap:10px; font-family: var(--font-display); font-weight: 700; }
  .nf-pulse{ width: min(560px, 80vw); opacity: .5; margin-bottom: 10px; }
  .nf-pulse path{ fill:none; stroke: var(--coral); stroke-width: 1.6; }
  .nf-code{
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(6rem, 22vw, 13rem);
    line-height: 0.9; letter-spacing: -0.04em;
    display: flex; justify-content: center;
  }
  .nf-code span{ display: inline-block; }
  .nf-title{ margin-top: 6px; color: var(--ink-on-deep-soft); font-size: clamp(1.1rem,2vw,1.4rem); }
  .nf-actions{ display:flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; justify-content: center; }
  .nf-cross{ position:absolute; opacity: .12; }
  .nf-cross svg{ width: 90px; height: 90px; }
  .nf-cross--1{ top: 14%; left: 8%; }
  .nf-cross--2{ bottom: 12%; right: 10%; }
</style>
</head>
<body>

<div class="nf-wrap">
  <a href="index.html" class="nf-brand">
    <span class="brand-logo-chip"><img src="assets/logo/logo.webp" alt="Stackly" class="brand-logo-img"></span>
  </a>

  <div class="nf-cross nf-cross--1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
  <div class="nf-cross nf-cross--2" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>

  <svg class="nf-pulse" viewBox="0 0 560 100" aria-hidden="true">
    <path id="nf-pulse-path" d="M0,50 L180,50 L210,15 L240,85 L270,50 L560,50"/>
  </svg>

  <div class="nf-code" data-split="chars" data-split-auto="true">404</div>
  <p class="nf-title">This page took a wrong turn somewhere on the pathway. It isn't here, but you're one click from where you need to be.</p>

  <div class="nf-actions">
    <button id="nf-back" class="btn btn-ghost on-deep magnetic-target">
      <span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
      Back
    </button>
    <a href="index.html" class="btn btn-primary magnetic-target">Home</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  document.getElementById('nf-back').addEventListener('click', () => history.back());

  // kinetic entrance for the 404 code + pulse draw, independent of the
  // shared preloader (this page skips it deliberately)
  window.addEventListener('DOMContentLoaded', () => {
    const path = document.getElementById('nf-pulse-path');
    if(window.gsap){
      const len = path.getTotalLength();
      gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
      gsap.to(path, { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut', delay: .2 });

      const chars = document.querySelectorAll('.nf-code .split-char');
      if(chars.length){
        gsap.set(chars, { yPercent: 140, opacity: 0, rotate: 6 });
        gsap.to(chars, { yPercent: 0, opacity: 1, rotate: 0, duration: 1, stagger: .08, ease: 'back.out(1.6)', delay: .1 });
      }
      gsap.fromTo('.nf-title', { opacity:0, y:16 }, { opacity:1, y:0, duration:.7, delay: .9 });
      gsap.fromTo('.nf-actions', { opacity:0, y:16 }, { opacity:1, y:0, duration:.7, delay: 1.05 });
      gsap.to('.nf-cross--1', { y: -16, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to('.nf-cross--2', { y: 16, duration: 4.6, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    }
  });

  // lightweight local split-text so this standalone page doesn't need animations.js
  function splitCharsLocal(){
    document.querySelectorAll('[data-split="chars"]').forEach(el => {
      const text = el.textContent;
      el.textContent = '';
      text.split('').forEach(ch => {
        const span = document.createElement('span');
        span.className = 'split-char';
        span.textContent = ch;
        el.appendChild(span);
      });
    });
  }
  splitCharsLocal();
</script>
</body>
</html>
